[theme]
# the app switches between light / dark / high contrast itself (see the Settings sidebar),
# this is only the base for Streamlit's own widgets
base = "light"
primaryColor = "#3B82F6"
font = "sans serif"

[theme.sidebar]
# navy blue sidebar: its buttons and dropdown use these colors instead of white
backgroundColor = "#0B1E5B"
secondaryBackgroundColor = "#1E3A8A"
textColor = "#FFFFFF"
primaryColor = "#60A5FA"

[server]
# lets the app use files from the "static" folder (the background image)
enableStaticServing = true
